# Optional: Render "Blueprint" (New + > Blueprint). Backend only; set secrets in the dashboard.
services:
  - type: web
    name: travel-booking-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: MONGO_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGIN, sync: false }
      - { key: PAYMENT_MODE, value: mock }
